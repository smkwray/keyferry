[package]
name = "keyctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ctrlc = { version = "=3.5.2", default-features = false }
keyferry-core = { path = "../../crates/keyferry-core" }
keyferry-layouts = { path = "../../crates/keyferry-layouts" }
keyferry-protocol = { path = "../../crates/keyferry-protocol" }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
uuid = { version = "=1.26.0", default-features = false, features = ["std", "v7"] }

[[test]]
name = "cli_parity"
path = "tests/cli_parity.rs"
harness = false
