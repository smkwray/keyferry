[package]
name = "keyctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
ctrlc = { version = "=3.5.2", default-features = false }
keyferry-core = { path = "../../crates/keyferry-core" }
keyferry-layouts = { path = "../../crates/keyferry-layouts" }
keyferry-protocol = { path = "../../crates/keyferry-protocol" }
png = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
time = { version = "=0.3.51", default-features = false, features = ["std", "formatting"] }
uuid = { version = "=1.26.0", default-features = false, features = ["std", "v7"] }

[[test]]
name = "cli_parity"
path = "tests/cli_parity.rs"
harness = false

[[test]]
name = "capture_cli"
path = "tests/capture_cli.rs"
harness = false

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["std", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
windows-future = { version = "=0.3.2", default-features = false, features = ["std"] }

[dev-dependencies]
keyferryd = { path = "../keyferryd" }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
