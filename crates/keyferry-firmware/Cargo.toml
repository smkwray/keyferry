[package]
name = "keyferry-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
keyferry-protocol = { path = "../keyferry-protocol" }
semver = { version = "=1.0.28", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde"] }
