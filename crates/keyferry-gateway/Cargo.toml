[package]
name = "keyferry-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
keyferry-protocol = { path = "../keyferry-protocol" }
ring = { version = "=0.17.14", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
x509-parser = { version = "=0.18.1", default-features = false }

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
