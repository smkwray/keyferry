[package]
name = "keyferry-local-management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
getrandom = { version = "=0.4.3", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
keyferry-protocol = { path = "../keyferry-protocol" }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false }
