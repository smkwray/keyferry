[package]
name = "keyferry-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
keyferry-core = { path = "../keyferry-core" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
png = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
time = { version = "=0.3.51", default-features = false, features = ["std", "formatting"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["std", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-future = { version = "=0.3.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dev-dependencies]
# Renders the synthetic small-text OCR fixture; no screen content is used.
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
