[workspace]
resolver = "2"
members = [
    "apps/keyferry",
    "apps/keyferryd",
    "apps/keyctl",
    "crates/keyferry-core",
    "crates/keyferry-capture",
    "crates/keyferry-gateway",
    "crates/keyferry-firmware",
    "crates/keyferry-layouts",
    "crates/keyferry-local-management",
    "crates/keyferry-protocol",
    "crates/keyferry-sim",
    "tools/keyferry-integration-tests",
    "tools/keyferry-pairing",
    "tools/keyferry-hil-check",
    "tools/keyferry-firmware",
    "xtask",
]
default-members = [
    "apps/keyferry",
    "apps/keyferryd",
    "apps/keyctl",
    "crates/keyferry-core",
    "crates/keyferry-capture",
    "crates/keyferry-gateway",
    "crates/keyferry-layouts",
    "crates/keyferry-local-management",
    "crates/keyferry-protocol",
    "crates/keyferry-sim",
]

[workspace.dependencies]
keyferry-capture = { path = "crates/keyferry-capture" }
sha2 = { version = "=0.10.9", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
ctrlc = { version = "=3.5.2", default-features = false }
keyferry-core = { path = "crates/keyferry-core" }
keyferry-layouts = { path = "crates/keyferry-layouts" }
keyferry-protocol = { path = "crates/keyferry-protocol" }
png = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
time = { version = "=0.3.51", default-features = false, features = ["std", "formatting"] }
uuid = { version = "=1.26.0", default-features = false, features = ["std", "v7"] }

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
authors = ["Keyferry contributors"]
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fast controller deploys (scripts/deploy_controller.ps1); published packages keep [profile.release].
[profile.deploy]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
lto = "off"
incremental = true
